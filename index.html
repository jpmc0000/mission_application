const EXPLANATIONS = {
  "Hunt the Hercules": {
    summary: "A visitor favorite, this scenario has two visitor aircraft that engage a C-130 Hercules aircraft controlled by a volunteer, in a set zone over a neutral airfield.",
    bullets: [
      "The goal of the visitors is to destroy the C-130 using only guns, while the goal of the volunteer is to survive as long as possible.",
      "This scenario highlights the importance of Basic Fighter Maneuvers (BFM) and is a great teaching moment for explaining speed management, Basic Heads-Up-Display (HUD) symbology and weapons employment.",
    ],
  },
};

function MissionExplanation({ missionName }) {
  const exp = EXPLANATIONS[missionName];
  return (
    <div style={{ marginBottom:20, background:"#060f06", border:`1px solid ${C.border}`, borderRadius:3, padding:"14px 16px" }}>
      <div style={{ color:C.green, fontSize:10, letterSpacing:"0.15em", marginBottom:10, textShadow:`0 0 6px ${C.green}55` }}>
        ▸ MISSION BRIEFING
      </div>
      {exp ? (
        <>
          <p style={{ color:"#4a9a4a", fontSize:12, lineHeight:1.8, marginBottom:10 }}>{exp.summary}</p>
          {exp.bullets && exp.bullets.map((b,i) => (
            <div key={i} style={{ display:"flex", gap:8, marginBottom:6 }}>
              <span style={{ color:C.green, fontSize:10, flexShrink:0, marginTop:2 }}>▶</span>
              <span style={{ color:"#4a9a4a", fontSize:12, lineHeight:1.7 }}>{b}</span>
            </div>
          ))}
        </>
      ) : (
        <p style={{ color:C.textDim, fontSize:12, fontStyle:"italic" }}>Mission briefing coming soon.</p>
      )}
    </div>
  );
}

function sideColor(side) {
  if (side==="Blue/NATO")   return C.cyan;
  if (side==="Red/Russian") return C.red;

  if (side==="WW2 German")  return C.purple;
  if (side==="Chinese")     return "#ff8800";
  return C.green;
}

// ── DYNAMIC SPAWN INFO ────────────────────────────────────────────────────────
function DynamicSpawnInfo() {
  return (
    <div style={{ marginTop:16, background:"#050d05", border:`1px solid ${C.border}`, borderRadius:3, padding:"14px 16px" }}>
      <div style={{ color:C.green, fontSize:11, fontWeight:700, letterSpacing:"0.1em", marginBottom:10, textShadow:`0 0 6px ${C.green}55` }}>▸ HOW TO USE DYNAMIC SLOTS</div>
      <img src={IMG_DYNAMIC} alt="Dynamic slot guide" style={{ width:"100%", borderRadius:2, border:`1px solid ${C.border}`, marginBottom:10 }} />
      {[
        { color:"#ff4444", label:"RED",    text:"Click the Dynamic slots tab to switch from spawn slots to dynamic slots." },
        { color:"#44ff44", label:"GREEN",  text:"Select the airfield or carrier name you want to spawn at." },
        { color:"#ffee00", label:"YELLOW", text:"Confirms whether the location is an Airfield or Aircraft carrier." },
      ].map((c,i) => (
        <div key={i} style={{ display:"flex", gap:8, alignItems:"flex-start", marginBottom:6 }}>
          <span style={{ color:c.color, fontWeight:700, fontSize:11, flexShrink:0 }}>{c.label} ▶</span>
          <span style={{ color:"#4a9a4a", fontSize:11, lineHeight:1.6 }}>{c.text}</span>
        </div>
      ))}
      <img src={IMG_SPAWN} alt="Spawn options" style={{ width:"100%", borderRadius:2, border:`1px solid ${C.border}`, margin:"12px 0 10px" }} />
      {[
        { color:"#ff4444", label:"RED",    text:"Click Unit Type to select which aircraft you want to spawn in." },
        { color:"#ffee00", label:"YELLOW", text:"Right-click any hardpoint box to attach weapons to that station." },
        { color:"#44ff44", label:"GREEN",  text:"Click Spawn Hot to spawn with the aircraft fully started and ready to fly." },
      ].map((c,i) => (
        <div key={i} style={{ display:"flex", gap:8, alignItems:"flex-start", marginBottom:6 }}>
          <span style={{ color:c.color, fontWeight:700, fontSize:11, flexShrink:0 }}>{c.label} ▶</span>
          <span style={{ color:"#4a9a4a", fontSize:11, lineHeight:1.6 }}>{c.text}</span>
        </div>
      ))}
      <div style={{ color:C.textDim, fontSize:11, marginTop:4 }}>Click <strong style={{color:C.green}}>OK</strong> to confirm your options and spawn into the mission.</div>
    </div>
  );
}

// ── GM SPAWN LIST ─────────────────────────────────────────────────────────────
function GMSpawnList() {
  const [search, setSearch] = useState("");
  const [side, setSide]     = useState("All");
  const [type, setType]     = useState("All");
  const [copied, setCopied] = useState(null);

  const filtered = useMemo(() => SPAWN_DATA.filter(u => {
    const q = search.toLowerCase();
    const matchSearch = !q || u.code.toLowerCase().includes(q) || u.name.toLowerCase().includes(q) || u.category.toLowerCase().includes(q);
    return matchSearch && (side==="All"||u.side===side) && (type==="All"||u.type===type);
  }), [search, side, type]);

  const copyCode = code => { navigator.clipboard.writeText(code).catch(()=>{}); setCopied(code); setTimeout(()=>setCopied(null),1500); };
  const sel = { background:C.bg, border:`1px solid ${C.border}`, borderRadius:2, padding:"5px 10px", color:C.green, fontSize:11, cursor:"pointer" };

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%" }}>
      <div style={{ padding:"10px 16px", borderBottom:`1px solid ${C.border}`, background:C.panel, display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
        <input placeholder="SEARCH CODE / UNIT NAME..." value={search} onChange={e=>setSearch(e.target.value)} style={{ background:C.bg, border:`1px solid ${C.border}`, borderRadius:2, padding:"5px 12px", color:C.green, fontSize:12, width:240 }} />
        <select value={side} onChange={e=>setSide(e.target.value)} style={sel}>{SIDES.map(s=><option key={s}>{s}</option>)}</select>
        <select value={type} onChange={e=>setType(e.target.value)} style={sel}>{TYPES.map(t=><option key={t}>{t}</option>)}</select>
        <span style={{ color:C.textDim, fontSize:11 }}>{filtered.length} UNIT{filtered.length!==1?"S":""}</span>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"140px 1fr 120px 110px 70px", padding:"6px 16px", borderBottom:`1px solid ${C.border}`, background:"#040a04" }}>
        {["SPAWN CODE","UNIT NAME","CATEGORY","SIDE",""].map((h,i)=><span key={i} style={{ color:C.textDim, fontSize:10, letterSpacing:"0.1em" }}>{h}</span>)}
      </div>
      <div style={{ flex:1, overflowY:"auto" }}>
        {filtered.map((u,i) => {
          const sc=sideColor(u.side); const isCopied=copied===u.code;
          return (
            <div key={i} style={{ display:"grid", gridTemplateColumns:"140px 1fr 120px 110px 70px", padding:"6px 16px", borderBottom:`1px solid #0d1a0d`, alignItems:"center", background:i%2===0?"transparent":"#060e06" }}
              onMouseEnter={e=>e.currentTarget.style.background=C.hover}
              onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"transparent":"#060e06"}
            >
              <span style={{ color:C.amber, fontSize:12, fontWeight:700, textShadow:`0 0 6px ${C.amber}55` }}>{u.code}</span>
              <span style={{ color:C.green, fontSize:12 }}>{u.name}</span>
              <span style={{ color:C.textDim, fontSize:11 }}>{u.category}</span>
              <span style={{ color:sc, fontSize:10 }}>{u.side}</span>
              <button onClick={()=>copyCode(u.code)} style={{ background:isCopied?`${C.green}22`:"transparent", border:`1px solid ${isCopied?C.green:C.border}`, borderRadius:2, padding:"3px 8px", color:isCopied?C.green:C.textDim, fontSize:10, cursor:"pointer", transition:"all 0.15s" }}>{isCopied?"✓ OK":"COPY"}</button>
            </div>
          );
        })}
        {filtered.length===0&&<div style={{ padding:"24px 16px", color:C.textDim, fontSize:12 }}>&gt; NO UNITS MATCH FILTER</div>}
      </div>
    </div>
  );
}

function sl(label, code, explanation) {
  return { id:"sl_"+(++_id), label, leaf:true, code:code||null, isDynamic:label.toLowerCase().includes('dynamic'), explanation:explanation||null };
}
function nd(label, children, explanation) {
  return { id:"nd_"+(++_id), label, children, explanation:explanation||null };
}

// ── TREE NODE ─────────────────────────────────────────────────────────────────
function TreeNode({ node, depth }) {
  const [open, setOpen] = useState(depth < 1);
  const hasChildren = node.children && node.children.length > 0;
  return (
    <div style={{ marginLeft:depth>0?14:0 }}>
      <div onClick={()=>hasChildren&&setOpen(o=>!o)} style={{ display:"flex", alignItems:"center", gap:8, padding:"4px 8px", marginBottom:2, borderRadius:2, cursor:hasChildren?"pointer":"default", borderLeft:depth>0?`1px solid ${C.border}`:"none" }}
        onMouseEnter={e=>{if(hasChildren||node.leaf)e.currentTarget.style.background=C.hover;}}
        onMouseLeave={e=>e.currentTarget.style.background="transparent"}
      >
        <span style={{ width:12, flexShrink:0, fontSize:9, color:node.leaf?C.amber:C.green }}>{node.leaf?"◆":hasChildren?(open?"▼":"▶"):"·"}</span>
        <span style={{ color:node.leaf?C.amber:depth===0?C.green:"#39cc10", fontSize:depth===0?13:12, fontWeight:depth===0?700:400, textShadow:node.leaf?`0 0 6px ${C.amber}66`:depth===0?`0 0 6px ${C.green}55`:"none" }}>{node.label}</span>
        {node.leaf&&node.code&&<span style={{ color:C.textDim, fontSize:10, marginLeft:4 }}>[{node.code}]</span>}
      </div>
      {open&&hasChildren&&(
        <div style={{ borderLeft:`1px dashed ${C.border}`, marginLeft:14, paddingLeft:2 }}>
          {node.children.map((c,i)=><TreeNode key={c.id||i} node={c} depth={depth+1} />)}
        </div>
      )}
    </div>
  );
}

// ── NODE DETAIL — shown when a non-leaf node with explanation is selected ─────
function NodeDetail({ node, onChoose, onBack, onReset, history, onGoTo }) {
  const exp = node.explanation;
  const slots = (node.children||[]).filter(c=>c.leaf);
  const subNodes = (node.children||[]).filter(c=>!c.leaf);

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", maxWidth:720, margin:"0 auto", width:"100%" }}>
      {/* Breadcrumb */}
      <div style={{ display:"flex", flexWrap:"wrap", alignItems:"center", gap:"3px 5px", padding:"7px 16px", borderBottom:`1px solid ${C.border}`, background:C.panel, minHeight:36 }}>
        <span style={{ color:C.textDim, fontSize:10, marginRight:3 }}>PATH://</span>
        {history.map((h,i)=>(
          <React.Fragment key={i}>
            <span onClick={()=>onGoTo(i)} style={{ color:i===history.length-1?C.green:C.textDim, fontSize:11, cursor:i<history.length-1?"pointer":"default", textShadow:i===history.length-1?`0 0 6px ${C.green}`:"none" }}>
              {h.label==="root"?"HOME":h.label}
            </span>
            {i<history.length-1&&<span style={{ color:C.border, fontSize:10 }}>/</span>}
          </React.Fragment>
        ))}
      </div>

      <div style={{ flex:1, overflowY:"auto", padding:"20px 18px" }}>
        <div style={{ color:C.green, fontSize:17, fontWeight:700, marginBottom:18, textShadow:`0 0 10px ${C.green}`, letterSpacing:"0.04em" }}>
          &gt; {node.label}
        </div>

        {/* Mission Briefing — at top */}
        <div style={{ marginBottom:20, background:"#060f06", border:`1px solid ${C.border}`, borderRadius:3, padding:"14px 16px" }}>
          <div style={{ color:C.green, fontSize:10, letterSpacing:"0.15em", marginBottom:10, textShadow:`0 0 6px ${C.green}55` }}>▸ MISSION BRIEFING</div>
          {exp ? (

          ) : (

        </div>

        {/* Sub-nodes if any */}
        {subNodes.length>0&&(
          <div style={{ marginBottom:16 }}>
            <div style={{ color:C.textDim, fontSize:10, letterSpacing:"0.12em", marginBottom:8 }}>SUB-CATEGORIES</div>
            <div style={{ display:"flex", flexDirection:"column", gap:5 }}>

// ── WIZARD ────────────────────────────────────────────────────────────────────
function Wizard({ onSpecial }) {
  const [history, setHistory] = useState([treeData]);
  const current = history[history.length-1];

  const choose = child => {
    if (child.label==="Game Master Spawn List") { onSpecial("gm");    return; }
    if (child.label==="How to Use")             { onSpecial("howto"); return; }
    setHistory(h=>[...h,child]);
  };
  const goBack  = () => setHistory(h=>h.length>1?h.slice(0,-1):h);
  const reset   = () => setHistory([treeData]);
  const goTo    = i  => setHistory(h=>h.slice(0,i+1));

  // If current node has an explanation and has leaf children, use NodeDetail
  const hasExplanation = !current.leaf && current.explanation;
  const hasLeafChildren = (current.children||[]).some(c=>c.leaf);

  if (hasExplanation || (hasLeafChildren && !current.leaf)) {
    // Always show NodeDetail for nodes that have slots as direct children
    if (hasLeafChildren || hasExplanation) {
      return <NodeDetail node={current} onChoose={choose} onBack={goBack} onReset={reset} history={history} onGoTo={goTo} />;
    }
  }

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", maxWidth:720, margin:"0 auto", width:"100%" }}>
      <div style={{ display:"flex", flexWrap:"wrap", alignItems:"center", gap:"3px 5px", padding:"7px 16px", borderBottom:`1px solid ${C.border}`, background:C.panel, minHeight:36 }}>
        <span style={{ color:C.textDim, fontSize:10, marginRight:3 }}>PATH://</span>
        {history.map((h,i)=>(
          <React.Fragment key={i}>
            <span onClick={()=>goTo(i)} style={{ color:i===history.length-1?C.green:C.textDim, fontSize:11, cursor:i<history.length-1?"pointer":"default", textShadow:i===history.length-1?`0 0 6px ${C.green}`:"none" }}>
              {h.label==="root"?"HOME":h.label}
            </span>
            {i<history.length-1&&<span style={{ color:C.border, fontSize:10 }}>/</span>}
          </React.Fragment>
        ))}
      </div>

      <div style={{ flex:1, overflowY:"auto", padding:"20px 18px" }}>
        {current.leaf ? (
          <div style={{ textAlign:"center", paddingTop:current.isDynamic?16:40 }}>
            {!current.isDynamic&&<div style={{ color:C.amber, fontSize:11, letterSpacing:"0.2em", marginBottom:16, textShadow:`0 0 10px ${C.amber}` }}>■ MISSION CONFIRMED ■</div>}
            <div style={{ background:"#100800", border:`1px solid ${C.amber}`, borderRadius:3, padding:"18px 32px", display:"inline-block", color:C.amber, fontSize:18, fontWeight:700, textShadow:`0 0 14px ${C.amber}`, boxShadow:`0 0 24px ${C.amber}22` }}>{current.label}</div>
            {current.code&&(
              <div style={{ marginTop:16, display:"inline-block", background:"#0a1a00", border:`1px solid ${C.green}55`, borderRadius:3, padding:"8px 20px" }}>
                <span style={{ color:C.textDim, fontSize:10, letterSpacing:"0.12em" }}>MISSION CODE // </span>
                <span style={{ color:C.green, fontSize:13, fontWeight:700, textShadow:`0 0 8px ${C.green}` }}>{current.code}</span>
              </div>
            )}
            {current.isDynamic
              ? <div style={{ marginTop:16, textAlign:"left" }}><DynamicSpawnInfo /></div>
              : <div style={{ color:C.textDim, fontSize:11, marginTop:24, letterSpacing:"0.1em" }}>&gt; LOCATE SLOT ON SERVER AND SPAWN IN<span style={{ animation:"blink 1s step-end infinite" }}>_</span></div>
            }
          </div>
        ) : (
          <>
            <div style={{ color:C.green, fontSize:history.length===1?20:17, fontWeight:700, marginBottom:18, textShadow:`0 0 10px ${C.green}`, letterSpacing:"0.04em" }}>
              &gt; {current.label==="root"?"DCS MISSION ASSISTANT":current.label}
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
              {(current.children||[]).map((child,i)=>(
                <button key={child.id||i} onClick={()=>choose(child)} style={{ background:child.leaf?"#0d0800":C.hover, border:`1px solid ${child.leaf?C.amberDim:C.border}`, borderRadius:2, padding:"10px 14px", color:child.leaf?C.amber:C.green, fontSize:13, textAlign:"left", cursor:"pointer", display:"flex", alignItems:"center", gap:10, transition:"all 0.1s" }}
                  onMouseEnter={e=>{e.currentTarget.style.background=child.leaf?"#1c1000":"#0d1a0d";e.currentTarget.style.borderColor=child.leaf?C.amber:C.green;e.currentTarget.style.boxShadow=`0 0 8px ${child.leaf?C.amber:C.green}33`;}}
                  onMouseLeave={e=>{e.currentTarget.style.background=child.leaf?"#0d0800":C.hover;e.currentTarget.style.borderColor=child.leaf?C.amberDim:C.border;e.currentTarget.style.boxShadow="none";}}>
                  <span style={{ fontSize:10, color:child.leaf?C.amberDim:C.textDim, flexShrink:0 }}>{String(i+1).padStart(2,"0")}</span>
                  <span style={{ flex:1 }}>{child.label}</span>
                  {child.leaf&&child.code&&<span style={{ color:C.textDim, fontSize:10 }}>{child.code}</span>}
                  {!child.leaf&&child.children&&child.children.length>0&&<span style={{ color:C.textDim, fontSize:10 }}>[{child.children.length}] ▶</span>}
                  {child.leaf&&!child.code&&<span style={{ color:C.amberDim, fontSize:10 }}>◆ SELECT</span>}
                </button>
              ))}
            </div>
          </>
        )}
      </div>

      <div style={{ padding:"8px 16px", borderTop:`1px solid ${C.border}`, background:C.panel, display:"flex", gap:8 }}>
        <button onClick={goBack} disabled={history.length===1} style={navBtn(history.length===1)}>[←] BACK</button>
        <button onClick={reset} style={navBtn(false)}>[⟳] RESET</button>
      </div>
    </div>
  );
}

function navBtn(d) {
  return { background:"transparent", border:`1px solid ${d?"#0d1a0d":C.border}`, borderRadius:2, padding:"5px 14px", color:d?"#0d1a0d":C.textDim, fontSize:11, cursor:d?"default":"pointer", letterSpacing:"0.06em" };
}

function flattenLeaves(node, path=[]) {
  const p=[...path,node.label];
  if (node.leaf) return [{ label:node.label, code:node.code, path:p }];
  return (node.children||[]).flatMap(c=>flattenLeaves(c,p));
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]       = useState("wizard");
  const [search, setSearch] = useState("");

  const allLeaves = flattenLeaves(treeData);
  const results = search.trim().length>1
    ? allLeaves.filter(l=>l.path.join(" ").toLowerCase().includes(search.toLowerCase())||(l.code&&l.code.toLowerCase().includes(search.toLowerCase())))
    : [];

  const tabs=[["wizard","MISSIONS"],["gm","GM SPAWN LIST"],["howto","HOW TO USE"],["tree","FULL TREE"]];

  return (
    <div className="flicker" style={{ background:C.bg, height:"100vh", display:"flex", flexDirection:"column" }}>
      <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"10px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, flexWrap:"wrap", boxShadow:`0 1px 0 #39ff1422` }}>
        <div>
          <div style={{ color:C.green, fontWeight:700, fontSize:15, letterSpacing:"0.1em", textShadow:`0 0 12px ${C.green}` }}>▸ UAS DCS MISSION ASSISTANT</div>
          <div style={{ color:C.textDim, fontSize:9, letterSpacing:"0.15em", marginTop:2 }}>SYSTEM ACTIVE // BY JOSEPH CURRAN</div>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
          {tab==="wizard"&&<input placeholder="SEARCH MISSIONS..." value={search} onChange={e=>setSearch(e.target.value)} style={{ background:C.bg, border:`1px solid ${C.border}`, borderRadius:2, padding:"6px 12px", color:C.green, fontSize:12, width:200 }} />}
          {tabs.map(([t,label])=>(
            <button key={t} onClick={()=>{setTab(t);setSearch("");}} style={{ background:tab===t?`${C.green}18`:"transparent", border:`1px solid ${tab===t?C.green:C.border}`, borderRadius:2, padding:"6px 14px", color:tab===t?C.green:C.textDim, fontSize:11, cursor:"pointer", letterSpacing:"0.08em", textShadow:tab===t?`0 0 8px ${C.green}`:"none", boxShadow:tab===t?`0 0 10px ${C.green}22`:"none" }}>{label}</button>
          ))}
        </div>
      </div>

      {tab==="wizard"&&search.trim().length>1&&(
        <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"10px 20px", maxHeight:260, overflowY:"auto" }}>
          <div style={{ color:C.textDim, fontSize:10, letterSpacing:"0.12em", marginBottom:8 }}>&gt; {results.length} RESULT{results.length!==1?"S":""} FOUND</div>
          {results.length===0&&<div style={{ color:C.textDim, fontSize:12 }}>&gt; NO MATCH: "{search}"</div>}
          {results.map((r,i)=>(
            <div key={i} style={{ padding:"6px 10px", borderRadius:2, marginBottom:4, background:"#0d0800", border:`1px solid ${C.amberDim}` }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <span style={{ color:C.amber, fontSize:12, textShadow:`0 0 6px ${C.amber}88` }}>◆ {r.label}</span>
                {r.code&&<span style={{ color:C.textDim, fontSize:10 }}>[{r.code}]</span>}
              </div>
              <div style={{ color:C.textDim, fontSize:10, marginTop:3 }}>{r.path.slice(1,-1).join(" / ")}</div>
            </div>
          ))}
        </div>
      )}

      <div style={{ flex:1, overflow:"hidden", display:"flex" }}>
        {tab==="wizard"&&<Wizard onSpecial={t=>setTab(t)} />}
        {tab==="gm"    &&<div style={{ flex:1, overflow:"hidden", display:"flex", flexDirection:"column" }}><GMSpawnList /></div>}
        {tab==="howto" &&<div style={{ flex:1, overflowY:"auto" }}><HowToUse /></div>}
        {tab==="tree"  &&(
          <div style={{ flex:1, overflowY:"auto", padding:"16px 20px" }}>
            <div style={{ color:C.textDim, fontSize:10, letterSpacing:"0.12em", marginBottom:12 }}>&gt; MISSION INDEX // CLICK NODES TO EXPAND</div>
            {treeData.children.map((child,i)=><TreeNode key={child.id||i} node={child} depth={0} />)}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
