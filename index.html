// ── ERA FILTER LOGIC ──────────────────────────────────────────────────────────
function nodeMatchesEra(node,era){
  if(era==="All Eras") return true;
  const map={"WW2":"ww2","Cold War":"cw","Modern":"modern"};
  const tag=map[era];
  if(!node.eras) return true;
  return node.eras.includes(tag);
}

          React.createElement("span",{style:{fontSize:10,color:C.textDim,flexShrink:0}},String(i+1).padStart(2,"0")),
          React.createElement("div",{style:{flex:1}},
            React.createElement("div",null,child.label),
            child.desc&&React.createElement("div",{style:{color:C.textDim,fontSize:11,marginTop:2}},child.desc),
            child.eras&&React.createElement(EraTag,{eras:child.eras})
          ),

function Wizard({onSpecial}){
  const [history,setHistory]=useState([treeData]);
  const [era,setEra]=useState("All Eras");
  const current=history[history.length-1];
  const choose=child=>{
    if(child.label==="Game Master Spawn List"){onSpecial("gm");return;}
    if(child.label==="How to Use"){onSpecial("howto");return;}
    setHistory(h=>[...h,child]);
  };
  const goBack=()=>setHistory(h=>h.length>1?h.slice(0,-1):h);
  const reset=()=>{setHistory([treeData]);setEra("All Eras");};
  const goTo=i=>setHistory(h=>h.slice(0,i+1));
  const hasLeafChildren=(current.children||[]).some(c=>c.leaf);
  if(hasLeafChildren||current.explanation)
    return React.createElement(SlotView,{node:current,era,onChoose:choose,onBack:goBack,onReset:reset,history,onGoTo:goTo});
  return React.createElement(MenuView,{node:current,era,setEra,onChoose:choose,onBack:goBack,onReset:reset,history,onGoTo:goTo});
}

function TreeNode({node,depth}){
  const [open,setOpen]=useState(depth<1);
  const has=node.children&&node.children.length>0;
  return React.createElement("div",{style:{marginLeft:depth>0?14:0}},
    React.createElement("div",{onClick:()=>has&&setOpen(o=>!o),
      style:{display:"flex",alignItems:"center",gap:8,padding:"4px 8px",marginBottom:2,borderRadius:2,cursor:has?"pointer":"default",borderLeft:depth>0?`1px solid ${C.border}`:"none"},
      onMouseEnter:e=>{if(has||node.leaf)e.currentTarget.style.background=C.hover;},
      onMouseLeave:e=>e.currentTarget.style.background="transparent"},
      React.createElement("span",{style:{width:12,flexShrink:0,fontSize:9,color:node.leaf?C.amber:C.green}},node.leaf?"◆":has?(open?"▼":"▶"):"·"),
      React.createElement("span",{style:{color:node.leaf?C.amber:depth===0?C.green:"#39cc10",fontSize:depth===0?13:12,fontWeight:depth===0?700:400}},node.display||node.label),
      node.leaf&&node.code&&React.createElement("span",{style:{color:C.textDim,fontSize:10,marginLeft:4}},"["+node.code+"]")
    ),
    open&&has&&React.createElement("div",{style:{borderLeft:`1px dashed ${C.border}`,marginLeft:14,paddingLeft:2}},
      node.children.map((c,i)=>React.createElement(TreeNode,{key:c.id||i,node:c,depth:depth+1}))
    )
  );
}

function flattenLeaves(node,path=[]){
  const p=[...path,node.display||node.label];
  if(node.leaf) return [{label:node.display||node.label,code:node.code,path:p}];
  return (node.children||[]).flatMap(c=>flattenLeaves(c,p));
}

function App(){
  const [tab,setTab]=useState("wizard");
  const [search,setSearch]=useState("");
  const allLeaves=flattenLeaves(treeData);
  const results=search.trim().length>1?allLeaves.filter(l=>l.path.join(" ").toLowerCase().includes(search.toLowerCase())||(l.code&&l.code.toLowerCase().includes(search.toLowerCase()))):[];
  const tabs=[["wizard","MISSIONS"],["gm","GM SPAWN LIST"],["howto","HOW TO USE"],["tree","FULL TREE"]];
  return React.createElement("div",{className:"flicker",style:{background:C.bg,height:"100vh",display:"flex",flexDirection:"column"}},
    React.createElement("div",{style:{background:C.panel,borderBottom:`1px solid ${C.border}`,padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap",boxShadow:`0 1px 0 #39ff1422`}},
